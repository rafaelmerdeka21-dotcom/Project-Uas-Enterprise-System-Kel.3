<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bgS)"/>
  <!-- Bottle body -->
  <rect x="135" y="140" width="130" height="180" rx="24" fill="url(#bottleGrad)" stroke="#67e8f9" stroke-width="4"/>
  <!-- Bottle neck -->
  <rect x="180" y="115" width="40" height="30" rx="4" fill="#0e7490" stroke="#67e8f9" stroke-width="2"/>
  <!-- Pump head -->
  <path d="M170 100 L230 100 L230 115 L170 115 Z" fill="#e0f2fe"/>
  <path d="M200 100 L200 80 L140 80 Q135 80 135 88 Q135 95 145 95 L180 95" fill="none" stroke="#e0f2fe" stroke-width="8" stroke-linecap="round"/>
  <!-- Droplet falling -->
  <circle cx="130" cy="115" r="4" fill="#67e8f9"/>
  <!-- Label -->
  <rect x="150" y="190" width="100" height="90" rx="12" fill="#ecfeff" stroke="#a5f3fc" stroke-width="2"/>
  <circle cx="200" cy="225" r="16" fill="#06b6d4" opacity="0.3"/>
  <path d="M200 215 C195 225 190 230 195 235 C200 240 205 235 205 230 Z" fill="#0891b2"/>
  <text x="200" y="260" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#0e7490" text-anchor="middle">ORGANIC SOAP</text>
  <text x="200" y="272" font-family="Inter, sans-serif" font-size="9" fill="#155e75" text-anchor="middle">500 ML</text>
  <text x="200" y="365" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#a5f3fc" text-anchor="middle">NATURAL ALOE VERA</text>
</svg>
