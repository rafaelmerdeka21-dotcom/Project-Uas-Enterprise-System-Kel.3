<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bgB)"/>
  <!-- Book spine shadow and pages -->
  <rect x="100" y="70" width="190" height="260" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
  <!-- Front cover -->
  <rect x="110" y="70" width="180" height="260" rx="8" fill="url(#bookGrad)" stroke="#34d399" stroke-width="3"/>
  <!-- Spine strap -->
  <rect x="110" y="70" width="22" height="260" fill="#065f46"/>
  <!-- Bookmark ribbon -->
  <path d="M220 70 L220 200 L232 188 L244 200 L244 70 Z" fill="#fbbf24"/>
  <!-- Label on cover -->
  <rect x="150" y="140" width="115" height="70" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <line x1="165" y1="165" x2="250" y2="165" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  <line x1="165" y1="180" x2="230" y2="180" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <line x1="165" y1="195" x2="215" y2="195" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <!-- Elastic band -->
  <line x1="265" y1="70" x2="265" y2="330" stroke="#064e3b" stroke-width="6"/>
  <text x="200" y="365" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#6ee7b7" text-anchor="middle">HARDCOVER NOTEBOOK A5</text>
</svg>
